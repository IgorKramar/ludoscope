name: Prepare reviewed maintenance
on:
  push:
    branches: ["codex/ludoscope-quality"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve compatible security patches
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Format changed modules
        run: npm exec -- prettier --write src/integration/api.ts src/integration/engines.ts src/integration/integrity.ts src/integration/report.ts src/analysis/mechanic.ts tests/agent-integrity.test.ts tests/evaluation-integrity.test.ts tests/history-integrity.test.ts tests/report-integrity.test.ts scripts/demo.mjs scripts/check-docs.mjs scripts/verify-package.mjs
      - name: Export reviewed public source changes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const paths = ["package-lock.json", "src/integration/api.ts", "src/integration/engines.ts", "src/integration/integrity.ts", "src/integration/report.ts", "src/analysis/mechanic.ts", "tests/agent-integrity.test.ts", "tests/evaluation-integrity.test.ts", "tests/history-integrity.test.ts", "tests/report-integrity.test.ts", "scripts/demo.mjs", "scripts/check-docs.mjs", "scripts/verify-package.mjs"];
          for (const path of paths) {
            const content = readFileSync(path, "utf8");
            const total = Math.ceil(content.length / 3000);
            for (let index = 0; index < total; index++)
              console.log("LUDOSCOPE_REVIEW_FILE " + JSON.stringify({ path, index, total, content: content.slice(index * 3000, (index + 1) * 3000) }));
          }
          NODE
